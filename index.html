<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hệ Thống Quản Lý Của Chía</title>
    
    <link rel="icon" type="image/jpeg" href="icon.jpg">
    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: #040407;
            color: #f8fafc;
            font-size: 15px;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .cyber-font { font-family: 'Orbitron', monospace; letter-spacing: 0.06em; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        
        /* Background dùng chung */
        .cyber-ambient-bg {
            background-color: #040407;
            background-image: 
                radial-gradient(circle at 20% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 100%, rgba(255, 0, 60, 0.08) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }
        .cyber-cut-btn { clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%); }
        
        /* Hiệu ứng Wuwa (Topup) */
        .wuwa-panel-glow {
            border: 1px solid rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.12), inset 0 0 15px rgba(0, 240, 255, 0.04);
            transition: all 0.3s ease;
        }
        .wuwa-panel-glow:hover {
            border-color: rgba(0, 240, 255, 0.85);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.25), inset 0 0 20px rgba(0, 240, 255, 0.08);
        }

        /* Hiệu ứng Kho Acc */
        .acc-panel-glow {
            border: 1px solid rgba(255, 0, 60, 0.4);
            box-shadow: 0 0 25px rgba(255, 0, 60, 0.12), inset 0 0 15px rgba(255, 0, 60, 0.04);
            transition: all 0.3s ease;
        }
        .acc-panel-glow:hover {
            border-color: rgba(255, 0, 60, 0.85);
            box-shadow: 0 0 35px rgba(255, 0, 60, 0.25), inset 0 0 20px rgba(255, 0, 60, 0.08);
        }
        .sold-panel-glow {
            border: 1px solid rgba(113, 113, 122, 0.4);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #040407; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }
    </style>
</head>
<body class="cyber-ambient-bg min-h-screen flex flex-col selection:bg-white selection:text-black">

    <!-- Global Header Menu -->
    <header class="sticky top-0 z-40 bg-[#06060a]/95 backdrop-blur-xl border-b border-zinc-800 px-3 sm:px-6 lg:px-8 py-3">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <!-- Brand -->
            <div class="flex items-center space-x-3.5 w-full md:w-auto justify-center md:justify-start">
                <div class="relative w-10 h-10 bg-zinc-900 border border-zinc-700 rounded-xl flex items-center justify-center">
                    <img src="icon.jpg" onerror="this.style.display='none'" class="w-full h-full object-cover rounded-xl absolute">
                    <i class="fa-solid fa-layer-group text-zinc-400"></i>
                </div>
                <div>
                    <h1 class="cyber-font text-lg font-black tracking-wider text-white uppercase">
                        HỆ THỐNG <span id="brandHighlight" class="text-cyan-400">WUWA</span>
                    </h1>
                </div>
            </div>

            <!-- Tab Switcher -->
            <div class="flex bg-black p-1 rounded-xl border border-zinc-800 w-full md:w-auto justify-center">
                <button onclick="switchMainApp('topup')" id="navTopup" class="px-6 py-2 text-xs font-black rounded-lg transition-all bg-cyan-500 text-black shadow-[0_0_15px_#00f0ff] flex items-center gap-2">
                    <i class="fa-solid fa-gem"></i> NẠP GAME
                </button>
                <button onclick="switchMainApp('account')" id="navAccount" class="px-6 py-2 text-xs font-bold rounded-lg text-zinc-400 hover:text-white transition-all flex items-center gap-2">
                    <i class="fa-solid fa-shield-virus"></i> KHO ACC
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-6 w-full flex-1">
        
        <!-- ==================== VIEW: WUWA TOPUP (SHEET 1) ==================== -->
        <div id="viewTopup" class="block animate-fade-in">
            <!-- Controls -->
            <div class="mb-6 p-4 rounded-xl bg-cyan-950/20 border border-cyan-900/50 flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="relative w-full md:w-2/3">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-cyan-400"></i>
                    <input type="text" id="topupSearch" oninput="handleTopupSearch()" placeholder="Tìm gói nạp, Lunites..."
                        class="w-full pl-12 pr-4 py-2.5 bg-black/80 border border-zinc-700/80 focus:border-cyan-400 rounded-xl text-sm text-white focus:outline-none transition">
                </div>
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <div class="flex-1 text-center px-4 py-2 bg-zinc-900 border border-cyan-900 rounded-lg text-xs font-bold text-cyan-400">
                        SỐ GÓI: <span id="topupCount" class="text-white ml-1">0</span>
                    </div>
                    <button onclick="openTopupModal()" class="flex-1 md:flex-none cyber-cut-btn px-6 py-2 bg-gradient-to-r from-cyan-500 to-teal-400 text-black font-black cyber-font text-xs uppercase shadow-[0_0_15px_#00f0ff] active:scale-95">
                        <i class="fa-solid fa-plus mr-1"></i> THÊM GÓI
                    </button>
                </div>
            </div>

            <!-- Grid -->
            <div id="topupGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            
            <div id="topupEmpty" class="hidden text-center py-20">
                <i class="fa-solid fa-gem text-5xl text-cyan-500/30 mb-4"></i>
                <h3 class="cyber-font text-lg text-white">CHƯA CÓ GÓI NẠP (SHEET 1)</h3>
            </div>
        </div>

        <!-- ==================== VIEW: KHO ACC (SHEET 2) ==================== -->
        <div id="viewAccount" class="hidden animate-fade-in">
            <!-- Controls -->
            <div class="mb-6 p-4 rounded-xl bg-red-950/20 border border-red-900/50 flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="relative w-full md:w-1/2">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-red-500"></i>
                    <input type="text" id="accSearch" oninput="handleAccSearch()" placeholder="Tìm theo mã, tài khoản..."
                        class="w-full pl-12 pr-4 py-2.5 bg-black/80 border border-zinc-700/80 focus:border-red-500 rounded-xl text-sm text-white focus:outline-none transition">
                </div>
                
                <div class="flex bg-black p-1 rounded-xl border border-zinc-800">
                    <button id="tabAccAvail" onclick="switchAccTab('available')" class="px-4 py-2 text-xs font-black rounded-lg bg-red-600 text-black shadow-[0_0_10px_#ff003c]">SẴN KHO (<span id="accAvailCount">0</span>)</button>
                    <button id="tabAccSold" onclick="switchAccTab('sold')" class="px-4 py-2 text-xs font-bold rounded-lg text-zinc-400 hover:text-white">ĐÃ BÁN (<span id="accSoldCount">0</span>)</button>
                </div>

                <button onclick="openAccModal()" class="w-full md:w-auto cyber-cut-btn px-6 py-2 bg-gradient-to-r from-red-600 to-rose-600 text-black font-black cyber-font text-xs uppercase shadow-[0_0_15px_#ff003c] active:scale-95">
                    <i class="fa-solid fa-plus mr-1"></i> THÊM ACC
                </button>
            </div>

            <!-- Grid -->
            <div id="accGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            
            <div id="accEmpty" class="hidden text-center py-20">
                <i class="fa-solid fa-shield-virus text-5xl text-red-500/30 mb-4"></i>
                <h3 class="cyber-font text-lg text-white">KHO ĐANG TRỐNG (SHEET 2)</h3>
            </div>
        </div>

        <!-- Global Loader -->
        <div id="globalLoader" class="text-center py-20 hidden">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-zinc-500 mb-4"></i>
            <h3 class="cyber-font text-lg text-zinc-400">ĐANG ĐỒNG BỘ DỮ LIỆU...</h3>
        </div>

    </main>

    <!-- ==================== MODALS ==================== -->

    <!-- 1. Modal Topup -->
    <div id="modalTopup" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="relative w-full max-w-lg bg-[#080b12] border-2 border-cyan-400 rounded-2xl overflow-hidden shadow-[0_0_40px_rgba(0,240,255,0.2)] flex flex-col">
            <div class="flex items-center justify-between p-4 border-b border-cyan-900 bg-zinc-950">
                <h2 class="cyber-font font-black text-cyan-400" id="topupModalTitle">THÊM GÓI NẠP (SHEET 1)</h2>
                <button onclick="closeModal('modalTopup')" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form onsubmit="saveTopup(event)" class="p-5 space-y-4">
                <input type="text" id="topupName" required placeholder="Tên gói (VD: Thẻ tháng)" class="w-full p-3 bg-black border border-zinc-700 rounded-xl text-white">
                <input type="number" id="topupPrice" required placeholder="Giá tiền (VNĐ)" class="w-full p-3 bg-black border border-zinc-700 rounded-xl text-yellow-400 font-bold">
                <label class="block w-full p-4 border-2 border-dashed border-zinc-700 text-center text-zinc-400 rounded-xl cursor-pointer hover:border-cyan-400">
                    <i class="fa-solid fa-upload block mb-2"></i> Tải ảnh gói lên
                    <input type="file" accept="image/*" class="hidden" onchange="handleSingleImgUpload(event, 'topupImgPreview')">
                </label>
                <img id="topupImgPreview" src="" class="hidden w-full h-32 object-contain bg-black rounded-xl border border-cyan-900">
                <button type="submit" id="btnSaveTopup" class="w-full py-3 cyber-cut-btn bg-cyan-500 text-black font-black">LƯU GÓI NẠP</button>
            </form>
        </div>
    </div>

    <!-- 2. Modal Account -->
    <div id="modalAccount" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden items-center justify-center p-2 sm:p-4 overflow-y-auto">
        <div class="relative w-full max-w-5xl bg-[#0a0a12] border-2 border-red-600 rounded-2xl shadow-[0_0_50px_rgba(255,0,60,0.35)] overflow-hidden flex flex-col my-auto max-h-[96vh]">
            <div class="flex items-center justify-between px-5 py-4 border-b border-red-900 bg-zinc-950">
                <h2 class="cyber-font font-black text-red-500" id="accModalTitle">THÊM TÀI KHOẢN (SHEET 2)</h2>
                <button onclick="closeModal('modalAccount')" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <form onsubmit="saveAccount(event)" class="flex-1 overflow-y-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-5">
                <div class="lg:col-span-5 space-y-3">
                    <div class="flex gap-2">
                        <input type="text" id="accIdVal" required placeholder="#Mã ACC" class="w-full p-2.5 bg-black border border-zinc-700 rounded-xl text-yellow-300 font-black">
                        <button type="button" onclick="document.getElementById('accIdVal').value = '#'+Math.floor(10000+Math.random()*90000); processAccCanvas();" class="px-3 bg-red-900/50 text-red-300 text-xs rounded-xl font-bold whitespace-nowrap">Sinh Mã</button>
                    </div>
                    <input type="number" id="accPriceVal" placeholder="Giá bán (VNĐ)" class="w-full p-2.5 bg-black border border-zinc-700 rounded-xl text-yellow-400">
                    <input type="text" id="accUserVal" required placeholder="Tài khoản / Email" class="w-full p-2.5 bg-black border border-zinc-700 rounded-xl text-white">
                    <input type="text" id="accPassVal" required placeholder="Mật khẩu game" class="w-full p-2.5 bg-black border border-zinc-700 rounded-xl text-white">
                    <input type="text" id="accHotmailVal" placeholder="Mật khẩu hotmail (nếu có)" class="w-full p-2.5 bg-black border border-zinc-700 rounded-xl text-white">
                    
                    <div class="border-t border-zinc-800 pt-3">
                        <label class="text-xs text-zinc-400 font-bold mb-2 block">CẤU HÌNH GHÉP ẢNH TỰ ĐỘNG:</label>
                        <div class="flex gap-2 mb-3">
                            <button type="button" onclick="setMode(1)" id="btnM1" class="px-2 py-1 text-xs bg-red-600 text-black font-bold rounded">1 Ảnh</button>
                            <button type="button" onclick="setMode(2)" id="btnM2" class="px-2 py-1 text-xs bg-zinc-800 text-zinc-400 font-bold rounded">2 Ảnh</button>
                            <button type="button" onclick="setMode(3)" id="btnM3" class="px-2 py-1 text-xs bg-zinc-800 text-zinc-400 font-bold rounded">3 Ảnh</button>
                        </div>
                        <div class="space-y-2">
                            <input type="file" accept="image/*" onchange="handleAccImg(event, 0)" class="block w-full text-xs text-zinc-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-red-900 file:text-red-200">
                            <input type="file" accept="image/*" onchange="handleAccImg(event, 1)" id="file2" class="hidden w-full text-xs text-zinc-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-red-900 file:text-red-200">
                            <input type="file" accept="image/*" onchange="handleAccImg(event, 2)" id="file3" class="hidden w-full text-xs text-zinc-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-red-900 file:text-red-200">
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-7 flex flex-col justify-center border-2 border-dashed border-red-900/50 rounded-xl bg-black/50 p-2 min-h-[250px]">
                    <img id="accCanvasPreview" src="" class="w-full object-contain rounded pointer-events-none" style="display:none;">
                    <div id="accNoImgText" class="text-center text-zinc-500 text-sm font-bold">Chưa có ảnh</div>
                </div>
            </form>
            
            <div class="p-4 border-t border-zinc-800 bg-zinc-950">
                <button type="button" onclick="document.querySelector('#modalAccount form').requestSubmit()" id="btnSaveAcc" class="w-full py-3 cyber-cut-btn bg-red-600 text-black font-black uppercase">LƯU TÀI KHOẢN</button>
            </div>
        </div>
    </div>

    <!-- 3. Modal Confirm Delete (Dùng chung) -->
    <div id="modalDelete" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="relative w-full max-w-sm bg-[#0a0a10] border-2 border-red-600 rounded-2xl p-6 text-center">
            <i class="fa-solid fa-triangle-exclamation text-4xl text-red-500 mb-3"></i>
            <h3 class="cyber-font text-lg font-black text-white mb-4">XÁC NHẬN XÓA?</h3>
            <div class="flex gap-3">
                <button onclick="closeModal('modalDelete')" class="flex-1 py-2 rounded-lg bg-zinc-800 text-white font-bold">HỦY</button>
                <button onclick="executeDelete()" class="flex-1 py-2 bg-red-600 text-black font-black rounded-lg">XÓA</button>
            </div>
        </div>
    </div>

    <!-- 4. Modal Image Viewer (Dùng chung) -->
    <div id="modalImg" class="fixed inset-0 z-50 bg-black/95 hidden items-center justify-center p-4" onclick="closeModal('modalImg')">
        <img id="bigViewer" src="" class="max-w-full max-h-[90vh] object-contain rounded border border-zinc-700">
    </div>

    <!-- 5. Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-[100] translate-y-24 opacity-0 transition-all duration-300 px-5 py-3 rounded-xl border border-zinc-600 bg-black text-white font-bold text-sm shadow-2xl">
        <span id="toastMsg">Ready</span>
    </div>

    <!-- Canvas ẩn dùng để xử lý ghép ảnh Acc -->
    <canvas id="hiddenCanvas" class="hidden"></canvas>

    <script>
        // ==========================================
        // CẤU HÌNH API
        // ==========================================
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbz8jGm4J3SjzQmucG0Q1ovDDNR2lk4jfCjhVVBspgP23XmjP-Kz0nlQyP0Q4HtHRy0/exec'; 

        // ==========================================
        // STATE QUẢN LÝ APP
        // ==========================================
        let currentApp = 'topup'; // 'topup' hoặc 'account'
        let currentAccTab = 'available'; // 'available' hoặc 'sold'
        
        let dataTopup = [];
        let dataAccount = [];
        
        let editingId = null;
        let deleteInfo = { id: null, type: null }; // type: 'topup' | 'account'

        // Biến cấu hình ghép ảnh Acc
        let accMode = 2;
        let accImgs = [null, null, null];
        let accFinalBase64 = "";

        // ==========================================
        // HÀM CHUYỂN ĐỔI GIAO DIỆN (TABS)
        // ==========================================
        function switchMainApp(app) {
            currentApp = app;
            const isTopup = app === 'topup';
            
            // Đổi UI Header
            document.getElementById('navTopup').className = isTopup 
                ? "px-6 py-2 text-xs font-black rounded-lg transition-all bg-cyan-500 text-black shadow-[0_0_15px_#00f0ff] flex items-center gap-2" 
                : "px-6 py-2 text-xs font-bold rounded-lg text-zinc-400 hover:text-white transition-all flex items-center gap-2";
            
            document.getElementById('navAccount').className = !isTopup 
                ? "px-6 py-2 text-xs font-black rounded-lg transition-all bg-red-600 text-black shadow-[0_0_15px_#ff003c] flex items-center gap-2" 
                : "px-6 py-2 text-xs font-bold rounded-lg text-zinc-400 hover:text-white transition-all flex items-center gap-2";

            document.getElementById('brandHighlight').textContent = isTopup ? "WUWA" : "KHO ACC";
            document.getElementById('brandHighlight').className = isTopup ? "text-cyan-400" : "text-red-500";

            // Đổi View
            document.getElementById('viewTopup').style.display = isTopup ? 'block' : 'none';
            document.getElementById('viewAccount').style.display = !isTopup ? 'block' : 'none';

            // Load data nếu mảng trống
            if (isTopup && dataTopup.length === 0) fetchTopup();
            if (!isTopup && dataAccount.length === 0) fetchAccount();
        }

        function switchAccTab(tab) {
            currentAccTab = tab;
            const isAvail = tab === 'available';
            
            document.getElementById('tabAccAvail').className = isAvail ? "px-4 py-2 text-xs font-black rounded-lg bg-red-600 text-black shadow-[0_0_10px_#ff003c]" : "px-4 py-2 text-xs font-bold rounded-lg text-zinc-400 hover:text-white";
            document.getElementById('tabAccSold').className = !isAvail ? "px-4 py-2 text-xs font-black rounded-lg bg-yellow-500 text-black shadow-[0_0_10px_#eab308]" : "px-4 py-2 text-xs font-bold rounded-lg text-zinc-400 hover:text-white";
            
            renderAccountGrid();
        }

        // ==========================================
        // API FETCH DATA
        // ==========================================
        async function fetchTopup() {
            showGlobalLoader(true);
            try {
                const res = await fetch(GAS_URL + "?sheet=Sheet1");
                const data = await res.json();
                dataTopup = Array.isArray(data) ? data.filter(d => d.id).sort((a,b) => (Number(a.price)||0) - (Number(b.price)||0)) : [];
                renderTopupGrid();
            } catch(e) { showToast("Lỗi tải Bảng Giá Nạp!", true); }
            showGlobalLoader(false);
        }

        async function fetchAccount() {
            showGlobalLoader(true);
            try {
                const res = await fetch(GAS_URL + "?sheet=Sheet2");
                const data = await res.json();
                dataAccount = Array.isArray(data) ? data.filter(d => d.id).map(r => ({
                    ...r, is_sold: String(r.is_sold) === 'true' || r.is_sold === true
                })).sort((a,b) => new Date(b.created_at) - new Date(a.created_at)) : [];
                renderAccountGrid();
            } catch(e) { showToast("Lỗi tải Kho Acc!", true); }
            showGlobalLoader(false);
        }

        // ==========================================
        // RENDER UI: WUWA TOPUP (SHEET 1)
        // ==========================================
        function renderTopupGrid() {
            const grid = document.getElementById('topupGrid');
            const empty = document.getElementById('topupEmpty');
            const q = document.getElementById('topupSearch').value.toLowerCase();
            
            let filtered = dataTopup;
            if (q) filtered = filtered.filter(x => (x.title||'').toLowerCase().includes(q));

            document.getElementById('topupCount').textContent = dataTopup.length;
            grid.innerHTML = '';
            
            if (filtered.length === 0) {
                grid.classList.add('hidden'); empty.classList.remove('hidden'); return;
            }
            grid.classList.remove('hidden'); empty.classList.add('hidden');

            filtered.forEach(item => {
                const priceFmt = (Number(item.price)||0).toLocaleString('vi-VN') + 'đ';
                const div = document.createElement('div');
                div.className = "relative bg-[#0d0d16] rounded-2xl flex flex-col justify-between wuwa-panel-glow overflow-hidden group";
                
                div.innerHTML = `
                    <div class="absolute top-2 right-2 z-10 flex gap-1 bg-black/80 p-1 rounded-lg">
                        <button onclick="openTopupModal('${item.id}')" class="w-8 h-8 rounded bg-zinc-800 text-cyan-400 hover:bg-cyan-500 hover:text-black"><i class="fa-solid fa-pen text-xs"></i></button>
                        <button onclick="confirmDelete('${item.id}', 'topup')" class="w-8 h-8 rounded bg-zinc-800 text-red-400 hover:bg-red-500 hover:text-black"><i class="fa-solid fa-trash text-xs"></i></button>
                    </div>
                    ${item.image ? `<img src="${item.image}" onclick="viewImg('${item.image}')" class="w-full h-48 object-cover cursor-pointer hover:scale-105 transition duration-500">` : `<div class="w-full h-40 bg-zinc-900 flex items-center justify-center text-cyan-900"><i class="fa-solid fa-gem text-4xl"></i></div>`}
                    <div class="p-4 flex flex-col justify-between flex-1">
                        <h3 class="cyber-font text-lg text-cyan-300 font-bold mb-2">${escapeHtml(item.title)}</h3>
                        <div class="flex justify-between items-end mt-auto pt-3 border-t border-zinc-800">
                            <span class="text-sm font-black text-yellow-400 bg-yellow-900/30 px-2 py-1 rounded">${priceFmt}</span>
                            <button onclick="copyQuoteTopup('${item.id}')" class="text-xs text-black bg-cyan-500 px-3 py-1.5 rounded font-bold hover:bg-white transition"><i class="fa-solid fa-share-nodes mr-1"></i> Báo giá</button>
                        </div>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        // ==========================================
        // RENDER UI: KHO ACC (SHEET 2)
        // ==========================================
        function renderAccountGrid() {
            const grid = document.getElementById('accGrid');
            const empty = document.getElementById('accEmpty');
            const q = document.getElementById('accSearch').value.toLowerCase();
            
            const isSoldTab = currentAccTab === 'sold';
            let filtered = dataAccount.filter(a => isSoldTab ? a.is_sold : !a.is_sold);
            if (q) filtered = filtered.filter(a => (a.title||'').toLowerCase().includes(q) || (a.username||'').toLowerCase().includes(q));

            document.getElementById('accAvailCount').textContent = dataAccount.filter(a => !a.is_sold).length;
            document.getElementById('accSoldCount').textContent = dataAccount.filter(a => a.is_sold).length;

            grid.innerHTML = '';
            if (filtered.length === 0) {
                grid.classList.add('hidden'); empty.classList.remove('hidden'); return;
            }
            grid.classList.remove('hidden'); empty.classList.add('hidden');

            filtered.forEach(acc => {
                const priceFmt = (Number(acc.price)||0).toLocaleString('vi-VN') + 'đ';
                const div = document.createElement('div');
                div.className = `relative bg-[#0d0d16] rounded-2xl flex flex-col overflow-hidden ${isSoldTab ? 'sold-panel-glow opacity-90' : 'acc-panel-glow'} group`;

                const hotmailHTML = acc.hotmail_password ? `<div class="flex justify-between items-center bg-black p-2 rounded text-xs border border-zinc-800 mt-1"><span class="text-cyan-400 font-bold">Hotmail:</span> <span class="text-zinc-300 select-all">${escapeHtml(acc.hotmail_password)}</span></div>` : '';

                div.innerHTML = `
                    <div class="absolute top-2 right-2 z-10 flex gap-1 bg-black/80 p-1 rounded-lg">
                        <button onclick="openAccModal('${acc.id}')" class="w-8 h-8 rounded bg-zinc-800 text-cyan-400 hover:bg-cyan-500 hover:text-black"><i class="fa-solid fa-pen text-xs"></i></button>
                        ${isSoldTab ? `
                            <button onclick="confirmDelete('${acc.id}', 'account')" class="w-8 h-8 rounded bg-zinc-800 text-red-500 hover:bg-red-600 hover:text-black"><i class="fa-solid fa-trash text-xs"></i></button>
                            <button onclick="toggleSoldState('${acc.id}')" class="w-8 h-8 rounded bg-zinc-800 text-green-400 hover:bg-green-500 hover:text-black" title="Hoàn về Kho"><i class="fa-solid fa-rotate-left text-xs"></i></button>
                        ` : `
                            <button onclick="toggleSoldState('${acc.id}')" class="w-8 h-8 rounded bg-zinc-800 text-yellow-400 hover:bg-yellow-500 hover:text-black" title="Đã bán"><i class="fa-solid fa-check text-xs"></i></button>
                        `}
                    </div>
                    ${acc.image ? `<img src="${acc.image}" onclick="viewImg('${acc.image}')" class="w-full h-48 object-cover cursor-pointer ${isSoldTab?'grayscale':''}">` : `<div class="w-full h-40 bg-zinc-900 flex items-center justify-center text-red-900"><i class="fa-solid fa-shield text-4xl"></i></div>`}
                    <div class="p-4 flex flex-col gap-2 flex-1">
                        <div class="flex justify-between items-start">
                            <h3 class="cyber-font text-lg ${isSoldTab?'text-yellow-500 line-through':'text-red-500'} font-bold">${escapeHtml(acc.title)}</h3>
                            <span class="text-sm font-black text-yellow-400 bg-yellow-900/30 px-2 py-0.5 rounded">${priceFmt}</span>
                        </div>
                        <div class="flex justify-between items-center bg-black p-2 rounded text-xs border border-zinc-800 mt-2">
                            <span class="text-zinc-400">TK:</span> <span class="text-white font-bold select-all">${escapeHtml(acc.username)}</span>
                        </div>
                        <div class="flex justify-between items-center bg-black p-2 rounded text-xs border border-zinc-800">
                            <span class="text-zinc-400">Pass:</span> <span class="text-white font-bold select-all">${escapeHtml(acc.password)}</span>
                        </div>
                        ${hotmailHTML}
                        <div class="mt-auto pt-3 flex gap-2">
                            ${acc.image ? `<button onclick="dlImg('${acc.image}', '${escapeHtml(acc.title)}',${acc.price})" class="flex-1 py-1.5 bg-zinc-800 text-xs text-white rounded font-bold hover:bg-cyan-600"><i class="fa-solid fa-download"></i> Tải ảnh</button>` : ''}
                            <button onclick="copyQuoteAcc('${acc.id}')" class="flex-1 py-1.5 bg-red-900/50 text-red-300 text-xs rounded font-bold border border-red-500 hover:bg-red-600 hover:text-white"><i class="fa-solid fa-copy"></i> Copy Data</button>
                        </div>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        // ==========================================
        // ACTION TÀI KHOẢN (BÁN / KHÔI PHỤC)
        // ==========================================
        async function toggleSoldState(id) {
            const acc = dataAccount.find(a => a.id === id);
            if(!acc) return;
            acc.is_sold = !acc.is_sold;
            acc.sold_at = acc.is_sold ? new Date().toISOString() : null;
            
            // Update local
            renderAccountGrid();
            showToast(acc.is_sold ? "Đã chuyển vào lịch sử bán!" : "Đã hoàn về kho!");

            // Gọi API lưu
            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'save', sheetName: 'Sheet2', ...acc })
                });
            } catch(e) {
                showToast("Lỗi đồng bộ trạng thái!", true);
            }
        }

        // ==========================================
        // LOGIC LƯU DATA (CHUNG CHUẨN)
        // ==========================================
        // WUWA TOPUP
        window.openTopupModal = function(id = null) {
            editingId = id;
            document.getElementById('topupModalTitle').textContent = id ? "SỬA GÓI NẠP" : "THÊM GÓI NẠP (SHEET 1)";
            
            if(id) {
                const pkg = dataTopup.find(x => x.id === id);
                document.getElementById('topupName').value = pkg.title || '';
                document.getElementById('topupPrice').value = pkg.price || '';
                document.getElementById('topupImgPreview').src = pkg.image || '';
                document.getElementById('topupImgPreview').style.display = pkg.image ? 'block' : 'none';
            } else {
                document.getElementById('topupName').value = '';
                document.getElementById('topupPrice').value = '';
                document.getElementById('topupImgPreview').src = '';
                document.getElementById('topupImgPreview').style.display = 'none';
            }
            document.getElementById('modalTopup').classList.replace('hidden', 'flex');
        };

        window.saveTopup = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSaveTopup');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ĐANG LƯU...';
            btn.disabled = true;

            const payload = {
                action: 'save',
                sheetName: 'Sheet1',
                id: editingId || ('pkg_' + Date.now()),
                title: document.getElementById('topupName').value.trim(),
                price: parseFloat(document.getElementById('topupPrice').value) || 0,
                image: document.getElementById('topupImgPreview').src
            };

            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                const json = await res.json();
                if(json.success) {
                    showToast("Đã lưu gói nạp thành công!");
                    closeModal('modalTopup');
                    fetchTopup();
                } else throw new Error(json.error);
            } catch(err) {
                showToast("Lỗi lưu dữ liệu!", true);
            } finally {
                btn.innerHTML = 'LƯU GÓI NẠP'; btn.disabled = false;
            }
        };

        // KHO ACC
        window.openAccModal = function(id = null) {
            editingId = id;
            document.getElementById('accModalTitle').textContent = id ? "SỬA TÀI KHOẢN" : "THÊM TÀI KHOẢN (SHEET 2)";
            
            if(id) {
                const acc = dataAccount.find(x => x.id === id);
                document.getElementById('accIdVal').value = acc.title || '';
                document.getElementById('accPriceVal').value = acc.price || '';
                document.getElementById('accUserVal').value = acc.username || '';
                document.getElementById('accPassVal').value = acc.password || '';
                document.getElementById('accHotmailVal').value = acc.hotmail_password || '';
                
                accFinalBase64 = acc.image || '';
                document.getElementById('accCanvasPreview').src = accFinalBase64;
                document.getElementById('accCanvasPreview').style.display = accFinalBase64 ? 'block' : 'none';
                document.getElementById('accNoImgText').style.display = accFinalBase64 ? 'none' : 'block';
            } else {
                document.getElementById('accIdVal').value = '#'+Math.floor(10000+Math.random()*90000);
                document.getElementById('accPriceVal').value = '';
                document.getElementById('accUserVal').value = '';
                document.getElementById('accPassVal').value = '';
                document.getElementById('accHotmailVal').value = '';
                accImgs = [null, null, null];
                accFinalBase64 = "";
                document.getElementById('accCanvasPreview').src = '';
                document.getElementById('accCanvasPreview').style.display = 'none';
                document.getElementById('accNoImgText').style.display = 'block';
            }
            document.getElementById('modalAccount').classList.replace('hidden', 'flex');
        };

        window.saveAccount = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSaveAcc');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ĐANG LƯU...';
            btn.disabled = true;

            let existing = editingId ? dataAccount.find(a => a.id === editingId) : {};

            const payload = {
                action: 'save',
                sheetName: 'Sheet2',
                id: editingId || ('acc_' + Date.now()),
                title: document.getElementById('accIdVal').value.trim(),
                price: parseFloat(document.getElementById('accPriceVal').value) || 0,
                username: document.getElementById('accUserVal').value.trim(),
                password: document.getElementById('accPassVal').value.trim(),
                hotmail_password: document.getElementById('accHotmailVal').value.trim(),
                image: accFinalBase64,
                is_sold: existing.is_sold || false,
                sold_at: existing.sold_at || null,
                created_at: existing.created_at || new Date().toISOString()
            };

            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
                const json = await res.json();
                if(json.success) {
                    showToast("Đã lưu Account thành công!");
                    closeModal('modalAccount');
                    fetchAccount();
                } else throw new Error(json.error);
            } catch(err) {
                showToast("Lỗi lưu dữ liệu!", true);
            } finally {
                btn.innerHTML = 'LƯU TÀI KHOẢN'; btn.disabled = false;
            }
        };

        // ==========================================
        // XÓA DỮ LIỆU
        // ==========================================
        window.confirmDelete = function(id, type) {
            deleteInfo = { id, type };
            document.getElementById('modalDelete').classList.replace('hidden', 'flex');
        };

        window.executeDelete = async function() {
            const { id, type } = deleteInfo;
            if(!id) return;
            
            closeModal('modalDelete');
            showGlobalLoader(true);

            const sName = type === 'topup' ? 'Sheet1' : 'Sheet2';
            try {
                const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'delete', id: id, sheetName: sName }) });
                const json = await res.json();
                if(json.success) {
                    showToast("Đã xóa vĩnh viễn!");
                    if(type === 'topup') fetchTopup(); else fetchAccount();
                }
            } catch(e) {
                showToast("Lỗi khi xóa!", true);
            }
        };

        // ==========================================
        // XỬ LÝ ẢNH (SINGLE VÀ COLLAGE)
        // ==========================================
        // Xử lý up ảnh đơn cho Topup
        window.handleSingleImgUpload = function(e, previewId) {
            const file = e.target.files[0];
            if(!file) return;
            const r = new FileReader();
            r.onload = ev => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxW = 400; const scale = Math.min(1, maxW/img.width);
                    canvas.width = img.width * scale; canvas.height = img.height * scale;
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    const b64 = canvas.toDataURL('image/jpeg', 0.8);
                    const pv = document.getElementById(previewId);
                    pv.src = b64; pv.style.display = 'block';
                };
                img.src = ev.target.result;
            };
            r.readAsDataURL(file);
        };

        // Xử lý ghép ảnh (Collage) cho Account
        window.setMode = function(m) {
            accMode = m;
            document.getElementById('btnM1').className = m===1 ? "px-2 py-1 text-xs bg-red-600 text-black font-bold rounded" : "px-2 py-1 text-xs bg-zinc-800 text-zinc-400 font-bold rounded";
            document.getElementById('btnM2').className = m===2 ? "px-2 py-1 text-xs bg-red-600 text-black font-bold rounded" : "px-2 py-1 text-xs bg-zinc-800 text-zinc-400 font-bold rounded";
            document.getElementById('btnM3').className = m===3 ? "px-2 py-1 text-xs bg-red-600 text-black font-bold rounded" : "px-2 py-1 text-xs bg-zinc-800 text-zinc-400 font-bold rounded";
            
            document.getElementById('file2').style.display = m >= 2 ? 'block' : 'none';
            document.getElementById('file3').style.display = m === 3 ? 'block' : 'none';
            processAccCanvas();
        }

        window.handleAccImg = function(e, idx) {
            const file = e.target.files[0];
            if(!file) return;
            const r = new FileReader();
            r.onload = ev => {
                const img = new Image();
                img.onload = () => { accImgs[idx] = img; processAccCanvas(); };
                img.src = ev.target.result;
            };
            r.readAsDataURL(file);
        }

        window.processAccCanvas = function() {
            if(!accImgs.some(i => i)) return;
            
            const cvs = document.getElementById('hiddenCanvas');
            const ctx = cvs.getContext('2d');
            const W = 800, H = 500;
            cvs.width = W; cvs.height = H;
            ctx.fillStyle = '#040407'; ctx.fillRect(0,0,W,H);

            function drawCrop(img, x,y,w,h) {
                if(!img) return;
                const scale = Math.max(w/img.width, h/img.height);
                const dw = img.width*scale, dh = img.height*scale;
                const dx = x + (w-dw)/2, dy = y + (h-dh)/2;
                ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
                ctx.drawImage(img, dx, dy, dw, dh);
                ctx.restore();
            }

            if(accMode === 1) drawCrop(accImgs[0], 0,0,W,H);
            else if(accMode === 2) {
                drawCrop(accImgs[0], 0,0,W,H/2);
                drawCrop(accImgs[1], 0,H/2,W,H/2);
                ctx.strokeStyle = '#ff003c'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();
            } else {
                const topH = H*0.55;
                drawCrop(accImgs[0], 0,0,W,topH);
                drawCrop(accImgs[1], 0,topH,W/2,H-topH);
                drawCrop(accImgs[2], W/2,topH,W/2,H-topH);
                ctx.strokeStyle = '#ff003c'; ctx.lineWidth=3; ctx.beginPath(); 
                ctx.moveTo(0,topH); ctx.lineTo(W,topH); ctx.moveTo(W/2,topH); ctx.lineTo(W/2,H); ctx.stroke();
            }

            // Vẽ Watermark mã Acc
            const code = document.getElementById('accIdVal').value.trim() || '#XXX';
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(10, H-40, 120, 30);
            ctx.strokeStyle = '#ff003c'; ctx.strokeRect(10, H-40, 120, 30);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.fillText(code, 20, H-20);

            accFinalBase64 = cvs.toDataURL('image/jpeg', 0.7);
            document.getElementById('accCanvasPreview').src = accFinalBase64;
            document.getElementById('accCanvasPreview').style.display = 'block';
            document.getElementById('accNoImgText').style.display = 'none';
        }

        // ==========================================
        // TIỆN ÍCH KHÁC
        // ==========================================
        window.closeModal = function(id) { document.getElementById(id).classList.replace('flex', 'hidden'); }
        window.viewImg = function(src) { document.getElementById('bigViewer').src = src; document.getElementById('modalImg').classList.replace('hidden','flex'); }
        
        window.showToast = function(msg, isErr=false) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.className = `fixed bottom-5 right-5 z-[100] translate-y-0 opacity-100 transition-all duration-300 px-5 py-3 rounded-xl border ${isErr?'border-yellow-500 text-yellow-400 bg-black':'border-cyan-400 text-white bg-[#0c0c16]'} shadow-2xl`;
            setTimeout(() => t.classList.replace('opacity-100','opacity-0'), 3000);
        }

        function showGlobalLoader(show) {
            document.getElementById('globalLoader').style.display = show ? 'block' : 'none';
        }

        function escapeHtml(str) { return str ? str.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;') : ''; }

        // Báo giá
        window.copyQuoteTopup = function(id) {
            const p = dataTopup.find(x=>x.id===id);
            if(!p) return;
            const price = (Number(p.price)||0)>0 ? (Number(p.price)||0).toLocaleString('vi-VN')+'đ' : 'Liên hệ';
            navigator.clipboard.writeText(`⚡ BẢNG GIÁ NẠP WUWA\n📦 Gói: ${p.title}\n💰 Giá: ${price}\n------------------\nNhắn ngay để lên đơn nhé ❤️`);
            showToast("Đã copy báo giá!");
        };

        window.copyQuoteAcc = function(id) {
            const a = dataAccount.find(x=>x.id===id);
            if(!a) return;
            const price = (Number(a.price)||0)>0 ? (Number(a.price)||0).toLocaleString('vi-VN')+'đ' : 'Liên hệ';
            navigator.clipboard.writeText(`📦 MÃ: ${a.title}\n💰 Giá: ${price}\n👤 TK: ${a.username}\n🔑 Pass: ${a.password}\n${a.hotmail_password?`📧 Hotmail: ${a.hotmail_password}\n`:''}------------------\nCảm ơn bạn đã ủng hộ!`);
            showToast("Đã copy data tài khoản!");
        };

        // Tải ảnh đóng dấu giá
        window.dlImg = function(src, title, price) {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                const cvs = document.createElement('canvas');
                cvs.width = img.width; cvs.height = img.height;
                const ctx = cvs.getContext('2d');
                ctx.drawImage(img,0,0);
                
                const pr = (Number(price)||0)>0 ? (Number(price)||0).toLocaleString('vi-VN')+'đ' : 'Liên hệ';
                ctx.font = 'bold 30px sans-serif';
                ctx.fillStyle = '#000'; ctx.fillRect(img.width-180, 20, 160, 40);
                ctx.fillStyle = '#fcee0a'; ctx.fillText(pr, img.width-170, 50);
                
                const a = document.createElement('a');
                a.href = cvs.toDataURL('image/jpeg', 0.9);
                a.download = (title||'image')+'.jpg';
                a.click();
            };
            img.src = src;
        };

        // Search
        window.handleTopupSearch = renderTopupGrid;
        window.handleAccSearch = renderAccountGrid;

        // Init
        window.onload = () => { switchMainApp('topup'); };
    </script>
</body>
